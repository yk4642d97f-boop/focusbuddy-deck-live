<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#0b0a09" />
<title>专注搭子</title>
<style>
  :root { --line: rgba(255,255,255,.42); --v1: 8%; --v2: 50%; --h1: 12%; --h2: 86%; --ease: cubic-bezier(.22,1,.36,1); }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #0b0a09; }
  body { cursor: default; -webkit-font-smoothing: antialiased; }
  #gl { position: fixed; inset: 0; width: 100%; height: 100%; display: block; filter: blur(26px) saturate(.6) brightness(.9); transform: scale(1.08); transition: filter 2.4s var(--ease), transform 2.8s var(--ease); }
  body.booted #gl { filter: none; transform: none; }

  /* hairline frame with four-point stars, after pear.no */
  #ov { position: fixed; inset: 0; pointer-events: none; }
  #ov .gv, #ov .gh { position: absolute; background: var(--line); filter: brightness(calc(1 + var(--wob, 0) * .9)); }
  #ov .gv { top: 0; bottom: 0; width: 1px; transform-origin: top; }
  #ov .gh { left: 0; right: 0; height: 1px; transform-origin: left; }
  #ov .gv.a { left: var(--v1); } #ov .gv.b { left: var(--v2); transform-origin: bottom; }
  #ov .gh.a { top: var(--h1); } #ov .gh.b { top: var(--h2); transform-origin: right; }
  #ov.in .gv { animation: drawV 1.6s var(--ease) both; }
  #ov.in .gh { animation: drawH 1.6s var(--ease) both; }
  #ov.in .gv.b { animation-delay: .12s; } #ov.in .gh.a { animation-delay: .2s; } #ov.in .gh.b { animation-delay: .3s; }
  @keyframes drawV { from { transform: scaleY(0); } to { transform: scaleY(1); } }
  @keyframes drawH { from { transform: scaleX(0); } to { transform: scaleX(1); } }
  #ov .st { position: absolute; width: 18px; height: 18px; margin: -9px 0 0 -9px; transform: rotate(var(--rot, 0deg)) scale(calc(1 + var(--wob, 0) * .5)); }
  #ov .st svg { width: 100%; height: 100%; fill: var(--line); display: block; filter: brightness(1.6); }
  #ov.in .st svg { animation: starIn 1.4s var(--ease) both; }
  #ov.in .st:nth-of-type(2) svg { animation-delay: .9s; } #ov.in .st:nth-of-type(3) svg { animation-delay: 1.05s; } #ov.in .st:nth-of-type(4) svg { animation-delay: 1.2s; }
  #ov .st:nth-of-type(1) svg { animation-delay: .75s; }
  @keyframes starIn { 0% { transform: scale(0) rotate(-90deg); } 60% { transform: scale(1.35) rotate(10deg); } 100% { transform: scale(1) rotate(0); } }
  #ov .s1 { left: var(--v1); top: var(--h1); } #ov .s2 { left: var(--v2); top: var(--h1); }
  #ov .s3 { left: var(--v1); top: var(--h2); } #ov .s4 { left: var(--v2); top: var(--h2); }

  /* crop marks */
  .crop { position: absolute; width: 22px; height: 22px; border-color: var(--line); border-style: solid; border-width: 0; opacity: .9; }
  .crop.tl { left: 22px; top: 22px; border-left-width: 1px; border-top-width: 1px; }
  .crop.tr { right: 22px; top: 22px; border-right-width: 1px; border-top-width: 1px; }
  .crop.bl { left: 22px; bottom: 22px; border-left-width: 1px; border-bottom-width: 1px; }
  .crop.br { right: 22px; bottom: 22px; border-right-width: 1px; border-bottom-width: 1px; }

  /* chapter rail */
  #rail { position: fixed; right: 30px; top: 50%; transform: translateY(-50%); display: flex; flex-direction: column; gap: 12px; z-index: 3; }
  #rail button { width: 18px; height: 10px; border: 0; background: none; cursor: pointer; position: relative; }
  #rail button::after { content: ''; position: absolute; right: 0; top: 50%; height: 1px; width: 8px; background: var(--line); transition: width .6s var(--ease), background .6s; filter: brightness(1.5); }
  #rail button.on::after { width: 18px; background: currentColor; }
  html[data-mode="paper"] #rail button { color: #1d1c19; }
  #rail button { color: #f2f1ed; }

  /* leader lines for the exploded view */
  #leaders { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  #leaders polyline { fill: none; stroke: #1d1c19; stroke-width: 1; opacity: .7; }
  #leaders circle { fill: #1d1c19; }
  #leaders rect { fill: none; stroke: #1d1c19; stroke-width: 1; }
  #leaders .slot { stroke: #1d1c19; stroke-width: 6; opacity: .08; stroke-linecap: round; }
  @media (prefers-reduced-motion: reduce) { #gl { transition: none; } #ov.in * { animation: none !important; } }
</style>
</head>
